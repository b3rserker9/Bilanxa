name: bilanqo
description: "Bilanqo: finanze personali, conti e movimenti."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
